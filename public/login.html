<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bejelentkezés - LiveChat Pro Operátor</title>
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('livechat_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5 position-relative" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);">

  <div class="container" style="max-width: 440px;">
    <div class="card card-custom p-4 p-md-5 border-0 shadow-lg text-white" style="background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15);">
      
      <!-- Brand Logo -->
      <div class="text-center mb-4">
        <div class="stat-icon bg-primary mx-auto mb-3 shadow-lg" style="width: 60px; height: 60px; font-size: 1.8rem; border-radius: 18px;">
          <i class="bi bi-headset"></i>
        </div>
        <h3 class="fw-bold text-white mb-1">LiveChat Pro</h3>
        <p class="text-white-50 small mb-0">Operátori & Adminisztrátori Belépés</p>
      </div>

      <!-- Error Alert -->
      <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 mb-3 small rounded-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span id="loginAlertText">Hiba történt</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-white-50">Felhasználónév</label>
          <div class="input-group">
            <span class="input-group-text bg-white bg-opacity-10 border-secondary text-white"><i class="bi bi-person"></i></span>
            <input type="text" id="loginUsername" class="form-control bg-white bg-opacity-10 border-secondary text-white placeholder-white" placeholder="Felhasználónév" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold text-white-50">Jelszó</label>
          <div class="input-group">
            <span class="input-group-text bg-white bg-opacity-10 border-secondary text-white"><i class="bi bi-lock"></i></span>
            <input type="password" id="loginPassword" class="form-control bg-white bg-opacity-10 border-secondary text-white" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-lg mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i> Bejelentkezés
        </button>
      </form>

      <div class="text-center mt-4">
        <a href="/" class="text-white-50 small text-decoration-none hover-white">
          <i class="bi bi-arrow-left me-1"></i> Vissza a demó oldalra
        </a>
      </div>

    </div>
  </div>

  <script>
    // Login Handling
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const alertBox = document.getElementById('loginAlert');
      const alertText = document.getElementById('loginAlertText');

      alertBox.classList.add('d-none');

      const serverUrl = window.LIVECHAT_SERVER_URL 
        || localStorage.getItem('livechat_server_url') 
        || (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? '' : null);

      try {
        let data;
        if (serverUrl !== null) {
          const res = await fetch(`${serverUrl}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          data = await res.json();
        } else {
          // Static demo login fallback for Netlify host
          if (username === 'admin' && password === 'admin123') {
            data = {
              success: true,
              token: 'livechat_demo_token',
              user: {
                username: 'admin',
                name: 'Kovács Péter',
                email: 'kovacs.peter@livechatpro.hu',
                title: 'Senior Supporter',
                role: 'Administrator',
                initials: 'KP',
                avatarColor: '#6366f1'
              }
            };
          } else {
            data = { success: false, message: 'Helytelen felhasználónév vagy jelszó!' };
          }
        }

        if (data.success) {
          localStorage.setItem('livechat_auth_token', data.token);
          localStorage.setItem('livechat_user', JSON.stringify(data.user));
          window.location.href = '/admin.html';
        } else {
          alertText.textContent = data.message || 'Hibás belépési adatok!';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        if (username === 'admin' && password === 'admin123') {
          localStorage.setItem('livechat_auth_token', 'livechat_demo_token');
          localStorage.setItem('livechat_user', JSON.stringify({
            username: 'admin',
            name: 'Kovács Péter',
            email: 'kovacs.peter@livechatpro.hu',
            title: 'Senior Supporter',
            role: 'Administrator',
            initials: 'KP',
            avatarColor: '#6366f1'
          }));
          window.location.href = '/admin.html';
        } else {
          alertText.textContent = 'Nem sikerült csatlakozni a szerverhez!';
          alertBox.classList.remove('d-none');
        }
      }
    });
  </script>
</body>
</html>

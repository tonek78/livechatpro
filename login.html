<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveChat Pro (PHP) - Operátori Bejelentkezés</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">

  <script>
    fetch('./api.php?action=check_install')
      .then(r => r.json())
      .then(data => {
        if (data && data.installed === false) {
          window.location.href = './install.php';
        }
      })
      .catch(() => {});
  </script>
</head>
<body class="bg-main d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 440px;">
    <div class="card card-custom p-4 p-md-5 border-0 shadow-lg position-relative overflow-hidden">
      
      <!-- Decorative Background Glow -->
      <div class="position-absolute top-0 start-50 translate-middle-x" style="width: 250px; height: 6px; background: var(--primary-gradient); border-radius: 0 0 10px 10px;"></div>

      <!-- Header Logo & Title -->
      <div class="text-center mb-4">
        <div class="stat-icon bg-primary text-white mx-auto mb-3 shadow-lg" style="width: 64px; height: 64px; border-radius: 18px; font-size: 2rem;">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3 class="fw-extrabold text-main mb-1">Operátori Belépés</h3>
        <p class="text-muted small">LiveChat Pro (PHP & MySQL) Vezérlőpult</p>
      </div>

      <!-- Alert Notification Container -->
      <div id="loginAlert" class="alert alert-danger d-none rounded-3 small mb-4" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-muted">Felhasználónév</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-secondary-subtle text-muted"><i class="bi bi-person"></i></span>
            <input type="text" id="loginUsername" class="form-control" placeholder="Felhasználónév" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold text-muted">Jelszó</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-secondary-subtle text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-lg mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i> Bejelentkezés
        </button>
      </form>

      <div class="text-center mt-3 pt-3 border-top">
        <a href="./install.php?force=1&step=2" class="text-decoration-none small text-primary fw-semibold">
          <i class="bi bi-gear-fill me-1"></i> Admin fiók jelszó beállítása / Újratelepítés
        </a>
      </div>

      <div class="text-center mt-2">
        <a href="./index.html" class="text-decoration-none small text-muted">
          <i class="bi bi-arrow-left me-1"></i> Vissza a főoldalra
        </a>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const alertBox = document.getElementById('loginAlert');
      const submitBtn = document.getElementById('btnLogin');

      if (!username || !password) {
        alertBox.textContent = 'Kérjük adja meg a felhasználónevet és jelszót!';
        alertBox.classList.remove('d-none');
        return;
      }

      alertBox.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Ellenőrzés...';

      const formData = new FormData();
      formData.append('action', 'login');
      formData.append('username', username);
      formData.append('password', password);

      try {
        const res = await fetch('./api.php', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('livechat_auth_token', data.token);
          if (data.user) {
            localStorage.setItem('livechat_user', JSON.stringify(data.user));
          }
          window.location.href = './admin.html';
        } else {
          alertBox.textContent = data.message || 'Hibás felhasználónév vagy jelszó!';
          alertBox.classList.remove('d-none');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Bejelentkezés';
        }
      } catch (err) {
        alertBox.textContent = 'Hiba történt a csatlakozás során!';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Bejelentkezés';
      }
    });
  </script>
</body>
</html>
